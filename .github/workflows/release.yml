name: Release

# One-click release: Actions → Release → Run workflow (or `gh workflow run release.yml`).
#
# 1. Runs the tests.
# 2. Works out the next version from the commits since the last v* tag
#    (git-cliff, see cliff.toml), or uses the bump you pick.
# 3. Regenerates CHANGELOG.md, commits it to main and tags the commit.
# 4. Creates a GitHub Release with the notes for this version.
#
# main is protected by a ruleset that requires the test checks, which the
# changelog commit can't have yet. GitHub Actions can't be put on the bypass
# list, so the commit and tag are pushed with RELEASE_TOKEN: a fine-grained
# token of a repository admin (admins bypass the ruleset) with Contents
# read/write on this repository. Unlike GITHUB_TOKEN pushes, these trigger
# docker.yml, which builds `latest` for the commit and the versioned images
# (1.2.3, 1.2, 1) for the tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = derived from commit messages)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GIT_CLIFF: npx --yes git-cliff@2.14.2

jobs:
  tests:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test.yml

  release:
    name: Tag and publish release
    needs: [tests]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::The RELEASE_TOKEN secret is missing. See the comment at the top of release.yml."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags for the changelog
          token: ${{ secrets.RELEASE_TOKEN }} # used by the push below

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Determine version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$last" ] && [ "$(git rev-list "$last"..HEAD --count)" = 0 ]; then
            echo "::error::No commits since $last — nothing to release."
            exit 1
          fi
          if [ "$BUMP" = auto ]; then
            tag=$($GIT_CLIFF --bumped-version --bump)
          else
            tag=$($GIT_CLIFF --bumped-version --bump "$BUMP")
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi
          echo "Releasing $tag (previous: ${last:-none})"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate changelog and release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $GIT_CLIFF --tag "$TAG" --output CHANGELOG.md
          $GIT_CLIFF --tag "$TAG" --unreleased --strip header > notes.md
          version=${TAG#v}
          {
            echo
            echo "### Docker images"
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/drum-trainer-backend:$version"
            echo "ghcr.io/${{ github.repository_owner }}/drum-trainer-frontend:$version"
            echo '```'
            echo "Deploy with \`DRUM_TRAINER_VERSION=$version\` in your compose \`.env\`."
          } >> notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changelog and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          # Atomic: if main moved meanwhile, neither the commit nor the tag lands.
          git push --atomic origin HEAD:main "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag

name: Tests

# Runs on pull requests, and is reused by docker.yml (pushes to main) and
# release.yml so every build and release is gated on the same checks.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Go tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run tests
        working-directory: backend
        run: go test ./...

  frontend:
    name: Frontend tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate SvelteKit types
        working-directory: frontend
        run: npx svelte-kit sync

      - name: Type check
        working-directory: frontend
        run: npm run check

      - name: Run tests
        working-directory: frontend
        run: npm test

name: Build and push Docker images

# Every push to main publishes `latest` images. A manually pushed v* tag also
# builds versioned images, but the normal way to release is release.yml.
on:
  push:
    branches: ['main']
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  images:
    needs: [tests]
    uses: ./.github/workflows/images.yml

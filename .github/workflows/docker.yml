name: Build and push Docker images

# Every push to main publishes `latest` images. Every v* tag builds versioned
# images; release.yml pushes its tag in a way that triggers this workflow.
on:
  push:
    branches: ['main']
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  images:
    needs: [tests]
    uses: ./.github/workflows/images.yml

# Serves the static SvelteKit SPA build. The outer reverse proxy (repo-root
# nginx.conf) routes /api/ to the backend and everything else here.
server {
    listen 3000;
    root /usr/share/nginx/html;

    # Content-hashed build assets never change — cache them for a year.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA manifest. nginx's mime.types has no entry for .webmanifest, and a
    # server-level `types` block would replace the whole map, so set it here.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Everything else: serve the file if it exists, otherwise hand the route
    # to the client-side router. index.html must not be cached so new
    # deployments are picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# PostgreSQL is used by default. To use SQLite, remove the DATABASE_URL
# environment variable from the backend service and the postgres service/volume.
#
# Set DRUM_TRAINER_VERSION in .env (e.g. 1.2.3) to pin a release so that
# `docker compose pull` never changes the version unexpectedly and rolling back
# is a one-line change. Unset, it tracks `latest` (the tip of main).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       drumtrainer
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${CONTAINER_MOUNTS_PATH}/drum-trainer/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d drumtrainer"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/schms27/drum-trainer-backend:${DRUM_TRAINER_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/drumtrainer
      BASE_URL: ${BASE_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      DEV_MODE: ${DEV_MODE}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      CONTACT_EMAIL: ${CONTACT_EMAIL}
    volumes:
      - ${CONTAINER_MOUNTS_PATH}/drum-trainer/data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: ghcr.io/schms27/drum-trainer-frontend:${DRUM_TRAINER_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "9980:80"
    volumes:
      - ${CONTAINER_MOUNTS_PATH}/drum-trainer/nginx.conf:/etc/nginx/conf.d/default.conf:ro

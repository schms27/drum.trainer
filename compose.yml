# Usage:
#   CODEBERG_USER=yourname docker compose up -d
#
# Or create a .env file in this directory containing:
#   CODEBERG_USER=yourname
#
# PostgreSQL is used by default. To revert to SQLite, remove the DATABASE_URL
# environment variable from the backend service and the postgres service/volume.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       drumtrainer
      POSTGRES_USER:     drum
      POSTGRES_PASSWORD: drum
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drum -d drumtrainer"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: codeberg.org/trashtr00per/drum-trainer-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://drum:drum@postgres:5432/drumtrainer
    volumes:
      - data:/data

  frontend:
    image: codeberg.org/trashtr00per/drum-trainer-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Must match the URL you open in the browser (SvelteKit CSRF protection).
      ORIGIN: http://localhost

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  data:
  pgdata:

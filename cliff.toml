# git-cliff configuration — generates CHANGELOG.md and GitHub Release notes.
# Used by .github/workflows/release.yml. Preview locally with:
#   npx git-cliff@2.14.2 --unreleased --bump
#
# Commits in this repo are plain imperative sentences ("Add pilot tracks",
# "Fix build"), not Conventional Commits, so they are grouped by their first
# word. Conventional prefixes (feat:, fix:, …) work as well.

[changelog]
header = """
# Changelog

All notable changes to drum.trainer. Generated by [git-cliff](https://git-cliff.org) from commit messages.\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/schms27/drum.trainer/releases/tag/{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/schms27/drum.trainer/commit/{{ commit.id }}))
{% endfor -%}
{% endfor %}
"""
footer = ""
trim = true

[git]
# Parse conventional commits when present, but keep all other commits too.
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"

# Matched top to bottom against the commit subject; first match wins.
# The <!-- n --> prefixes only control section order and are stripped.
commit_parsers = [
  # Release bookkeeping and noise.
  { message = "^chore\\(release\\)", skip = true },
  { message = "(?i)^(fi+x|fix again|more fixing|bullshit change|cleanup|wip)\\s*$", skip = true },

  { message = "(?i)^feat", group = "<!-- 0 -->Features" },
  { message = "^(Add|Implement|Support|Show|Make|Allow|Sync|Introduce|Enable|Do not)\\b", group = "<!-- 0 -->Features" },

  { message = "(?i)^fix", group = "<!-- 1 -->Bug fixes" },

  { message = "(?i)^(perf|refactor)", group = "<!-- 2 -->Changes" },
  { message = "^(Improve|Update|Change|Replace|Switch|Move|Rename|Remove|Cleanup)\\b", group = "<!-- 2 -->Changes" },

  { message = "(?i)^(doc|docs)\\b", group = "<!-- 3 -->Documentation" },
  { message = "(?i)^(test|tests)\\b", group = "<!-- 4 -->Tests" },
  { message = "(?i)^(ci|build|bump|chore)\\b", group = "<!-- 5 -->Build and CI" },
  { message = "(?i)^(Run tests|Semantic versioning)", group = "<!-- 5 -->Build and CI" },

  { message = ".*", group = "<!-- 6 -->Other" },
]

[bump]
# Before 1.0.0, features bump the minor version and fixes the patch version.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
# Unconventional commits: a new feature bumps minor, "BREAKING" bumps major,
# everything else bumps patch.
custom_minor_increment_regex = "^(Add|Implement|Support|Show|Make|Allow|Introduce|Enable)\\b"
custom_major_increment_regex = "BREAKING"
